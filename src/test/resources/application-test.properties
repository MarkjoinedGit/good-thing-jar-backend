spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
debug=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.jdbc.core=WARN
gtj.security.throttle-scope-key=test-throttle-scope-key-at-least-32-bytes
gtj.security.verification-delivery-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
gtj.throttle.authentication.capacity=1000
gtj.throttle.authentication.window=PT1M
gtj.throttle.verification-resend.capacity=1000
gtj.throttle.verification-resend.window=PT1M
gtj.throttle.invitation-create.capacity=1000
gtj.throttle.invitation-create.window=PT1M
gtj.throttle.invitation-retry.capacity=1000
gtj.throttle.invitation-retry.window=PT1M
gtj.throttle.entry-write.capacity=1000
gtj.throttle.entry-write.window=PT1M
gtj.outbox.scheduling-enabled=false
