spring.application.name=good-thing-jar-backend
server.servlet.context-path=/api/v1
spring.datasource.url=${GTJ_DB_URL:jdbc:postgresql://localhost:5432/good_thing_jar}
spring.datasource.username=${GTJ_DB_USERNAME:good_thing_jar}
spring.datasource.password=${GTJ_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.mail.host=${GTJ_MAIL_HOST:localhost}
spring.mail.port=${GTJ_MAIL_PORT:1025}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
springdoc.swagger-ui.path=/swagger-ui.html
gtj.public-base-url=${GTJ_PUBLIC_BASE_URL:http://localhost:8080}
gtj.security.throttle-scope-key=${GTJ_THROTTLE_SCOPE_KEY:}
gtj.security.verification-delivery-key=${GTJ_VERIFICATION_DELIVERY_KEY:}
gtj.throttle.authentication.capacity=${GTJ_THROTTLE_AUTH_CAPACITY:10}
gtj.throttle.authentication.window=${GTJ_THROTTLE_AUTH_WINDOW:PT1M}
gtj.throttle.verification-resend.capacity=${GTJ_THROTTLE_VERIFICATION_CAPACITY:3}
gtj.throttle.verification-resend.window=${GTJ_THROTTLE_VERIFICATION_WINDOW:PT5M}
gtj.throttle.invitation-create.capacity=${GTJ_THROTTLE_INVITATION_CREATE_CAPACITY:10}
gtj.throttle.invitation-create.window=${GTJ_THROTTLE_INVITATION_CREATE_WINDOW:PT1M}
gtj.throttle.invitation-retry.capacity=${GTJ_THROTTLE_INVITATION_RETRY_CAPACITY:5}
gtj.throttle.invitation-retry.window=${GTJ_THROTTLE_INVITATION_RETRY_WINDOW:PT1M}
gtj.throttle.entry-write.capacity=${GTJ_THROTTLE_ENTRY_CAPACITY:30}
gtj.throttle.entry-write.window=${GTJ_THROTTLE_ENTRY_WINDOW:PT1M}
gtj.outbox.claim-lease=${GTJ_OUTBOX_CLAIM_LEASE:PT5M}
