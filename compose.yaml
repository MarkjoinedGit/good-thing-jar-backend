services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: good_thing_jar
      POSTGRES_USER: good_thing_jar
      POSTGRES_PASSWORD: ${GTJ_DB_PASSWORD:-local-only-password}
    ports: ["${GTJ_DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U good_thing_jar -d good_thing_jar"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["gtj-postgres:/var/lib/postgresql"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  gtj-postgres:
